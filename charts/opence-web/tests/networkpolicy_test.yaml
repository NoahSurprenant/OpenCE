suite: network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: lets anyone reach nginx's port, and nothing out
    asserts:
      - equal: { path: 'spec.policyTypes', value: [Ingress, Egress] }
      - equal: { path: 'spec.ingress', value: [{ ports: [{ protocol: TCP, port: 8080 }] }] }
      - equal: { path: 'spec.egress', value: [] }

  - it: narrows the sources and takes extra rules
    set:
      networkPolicy:
        ingressFrom: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
        extraEgress: [{ to: [{ ipBlock: { cidr: 203.0.113.0/24 } }] }]
    asserts:
      - equal:
          path: spec.ingress[0]
          value:
            ports: [{ protocol: TCP, port: 8080 }]
            from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      - equal: { path: 'spec.egress', value: [{ to: [{ ipBlock: { cidr: 203.0.113.0/24 } }] }] }

  - it: renders nothing when off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
