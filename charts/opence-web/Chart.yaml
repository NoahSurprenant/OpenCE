apiVersion: v2
name: opence-web
description: >-
  The OpenCE web build: Halo: Combat Evolved in the browser, served by nginx with the headers the
  game needs. Optionally a private server of your own game data, mounted from a volume you provide.
type: application
# The major and minor: the Helm chart workflow publishes each change as <major>.<minor>.<run number>
# (oci://ghcr.io/noahsurprenant/charts, signed with cosign), so only a major or minor bump is an edit
# here.
version: 0.1.0
# The Kubernetes versions the Helm chart workflow tests. Raise it as old minors reach end of life.
kubeVersion: ">=1.34.0-0"
# Informational only: which image runs is set by image.repository, image.tag and image.digest.
appVersion: "latest"
home: https://github.com/NoahSurprenant/OpenCE
sources:
  - https://github.com/NoahSurprenant/OpenCE
keywords:
  - halo
  - webassembly
  - nginx
