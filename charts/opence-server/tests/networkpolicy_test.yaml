suite: network policy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: lets anyone reach the tunnel port, and nothing else in
    asserts:
      - equal: { path: 'spec.policyTypes', value: [Ingress, Egress] }
      - equal: { path: 'spec.ingress', value: [{ ports: [{ protocol: UDP, port: 27015 }] }] }

  - it: allows DNS, TCP 1883 and all UDP to public addresses only
    asserts:
      - equal: { path: 'spec.egress[0].ports', value: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }] }
      - equal: { path: 'spec.egress[1].to[0].ipBlock.cidr', value: 0.0.0.0/0 }
      - contains: { path: 'spec.egress[1].to[0].ipBlock.except', content: 10.0.0.0/8 }
      - contains: { path: 'spec.egress[1].to[0].ipBlock.except', content: 192.168.0.0/16 }
      - equal: { path: 'spec.egress[1].ports', value: [{ protocol: TCP, port: 1883 }, { protocol: UDP }] }

  - it: narrows the players' sources and follows the tunnel port
    set:
      network.tunnelPort: 27016
      networkPolicy.from: [{ ipBlock: { cidr: 198.51.100.0/24 } }]
    asserts:
      - equal:
          path: spec.ingress
          value: [{ ports: [{ protocol: UDP, port: 27016 }], from: [{ ipBlock: { cidr: 198.51.100.0/24 } }] }]

  - it: drops the internet rule when it allows nothing
    set:
      networkPolicy.internet: { tcpPorts: [], udp: false }
    asserts:
      - lengthEqual: { path: 'spec.egress', count: 1 }

  - it: renders nothing when off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
