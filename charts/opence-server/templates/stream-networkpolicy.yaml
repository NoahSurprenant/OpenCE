{{- if and .Values.stream.enabled .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# The stream: its web server's port in (from stream.networkPolicy.from, or anyone), and the server's
# system link datagrams (UDP 5151, its game advertisement and the game); out only to DNS and to the
# server pod's system link (TCP and UDP 5150). Nothing else: no internet, no other pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opence-server.streamName" . }}
  labels:
    {{- include "opence-server.streamLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opence-server.streamSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      {{- with .Values.stream.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "opence-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 5151
  egress:
    - to:
        {{- toYaml $np.dns.to | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "opence-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 5150
        - protocol: TCP
          port: 5150
{{- end }}
