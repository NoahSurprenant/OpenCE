{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# The players' UDP in on the tunnel port; out only to DNS, the MQTT brokers that carry invites, and
# UDP to the internet (STUN, and the players' own tunnel ports, which can be any). Nothing on the
# private ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opence-server.fullname" . }}
  labels:
    {{- include "opence-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opence-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: UDP
          port: {{ .Values.network.tunnelPort }}
      {{- with $np.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.stream.enabled }}
    # the stream (stream.enabled) joining over system link
    - from:
        - podSelector:
            matchLabels:
              {{- include "opence-server.streamSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 5150
        - protocol: TCP
          port: 5150
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        {{- toYaml $np.dns.to | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if or $np.internet.tcpPorts $np.internet.udp }}
    - to:
        - ipBlock:
            cidr: {{ $np.internet.cidr }}
            {{- with $np.internet.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- range $np.internet.tcpPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- if $np.internet.udp }}
        # Every UDP port: STUN (19302, 3478) and the players' tunnel ports.
        - protocol: UDP
        {{- end }}
    {{- end }}
    {{- if .Values.stream.enabled }}
    # system link to the stream: its game advertisement and the game
    - to:
        - podSelector:
            matchLabels:
              {{- include "opence-server.streamSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 5151
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
