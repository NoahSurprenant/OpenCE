# The smallest install that renders: no maps (an emptyDir in their place), so the server exits with
# status 2 (no usable maps) and the pod goes into CrashLoopBackOff. Installed by e2e/run.sh minimal.
# A real install gives gameData.existingClaim or gameData.nfs instead (README, Quick start).
gameData:
  volume:
    emptyDir: {}
