# The game data folders mounted under /srv/game-data (the URL's path is the file's under /srv): the
# files only, as they are. Range requests (206) work, as the page reads the big maps in parts; no
# gzip, which would turn them off. Symbolic links are not followed and hidden files are not served,
# so only what is in the mounted folders themselves is reachable.
root /srv;
gzip off;
disable_symlinks on;
include /etc/nginx/opence/headers.conf;
add_header Cache-Control no-cache always;
location ~ /\. {
    return 404;
}
try_files $uri =404;
