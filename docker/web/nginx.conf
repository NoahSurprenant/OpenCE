# The web site's nginx (docker/web/Dockerfile): the whole configuration, fixed in the image. Runs as
# uid 101 on port 8080 with a read-only root filesystem: everything it writes is in /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The site's file types (and the game data's; a map is application/octet-stream).
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/wasm wasm;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
        image/x-tga tga;
        audio/wav wav;
        text/plain txt log;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/javascript application/json application/manifest+json;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" $request_time';
    access_log /dev/stdout main;

    # Settings the deployment adds, if any: the chart's realIp (nginx's realip module, the visitor's
    # address from a trusted proxy's header in $remote_addr and the access log). None in the image:
    # nginx logs the address of whatever connected to it.
    include /etc/nginx/opence/conf.d/*.conf;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    autoindex off;
    # (the page asks for /server-data.json at each visit; without game data it is a 404, not an error)
    log_not_found off;
    etag on;
    # Redirects (a folder without its slash) keep the address the browser used, behind an ingress
    # or a port-forward too.
    absolute_redirect off;

    # Text and the game's code (halo.wasm); never the game data (game-data.conf).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript text/plain application/json application/manifest+json
               application/wasm image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/site;
        index index.html;

        # For the responses of the locations below that add no header of their own.
        include /etc/nginx/opence/headers.conf;

        # The site. no-cache: the browser revalidates each file (ETag, Last-Modified), as the page's
        # service worker and version.json expect of a new build.
        location / {
            include /etc/nginx/opence/headers.conf;
            add_header Cache-Control no-cache always;
            try_files $uri $uri/ =404;
        }

        # Hidden files (.nojekyll and the like) are not served.
        location ~ /\. {
            return 404;
        }

        # For the probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The private server's settings, which name the manifest (port/web/site/server-data.js): only
        # when the manifest script wrote them. Without game data there is no such file, and the page
        # sees a 404: the plain site.
        location = /server-data.json {
            alias /srv/generated/server-data.json;
            disable_symlinks on;
            include /etc/nginx/opence/headers.conf;
            add_header Cache-Control no-store always;
        }

        location = /game-data/manifest.json {
            alias /srv/generated/manifest.json;
            disable_symlinks on;
            include /etc/nginx/opence/headers.conf;
            add_header Cache-Control no-store always;
        }

        # The game data: these three folders only, each a read-only mount; anything else under
        # /game-data/ is a 404.
        location ^~ /game-data/ {
            return 404;
        }
        location ^~ /game-data/maps/ {
            include /etc/nginx/opence/game-data.conf;
        }
        location ^~ /game-data/skate-data/assets/ {
            include /etc/nginx/opence/game-data.conf;
        }
        location ^~ /game-data/skate-data/sounds/ {
            include /etc/nginx/opence/game-data.conf;
        }
    }
}
