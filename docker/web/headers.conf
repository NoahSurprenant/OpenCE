# On every response (included by each location that adds a header of its own, as add_header in a
# location replaces the server's). The game's threads need SharedArrayBuffer, and so a cross-origin
# isolated page: the first two make it one without the service worker's reload (port/web/site/sw.js).
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header X-Content-Type-Options nosniff always;
