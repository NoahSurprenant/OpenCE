[package]
name = "halo-skate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# (an rlib too, for tests/, which drive the C interface the way the game does)
crate-type = ["staticlib", "rlib"]

[dependencies]
bevy_math = "0.19"
# the board's meshes and texture, from the converted skater model (board.rs)
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
png = "0.18"
skate-host = { path = "../vendor/skate-host" }

[dev-dependencies]
# (tests/common/halo_map.rs: a Halo Xbox map is deflated after its header)
flate2 = "1.1"
serde_json.workspace = true
