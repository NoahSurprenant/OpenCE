[package]
name="skate-host"
version="0.1.0"
edition="2024"
publish=false
[dependencies]
bevy={version="0.19",default-features=false,features=["std","multi_threaded","bevy_log"]}
skate-core={path="../skate-core"}
skate-data={path="../skate-data"}
skate-net={path="../skate-net"}
serde={version="1",features=["derive"]}
serde_json="1"
half="2.7.1"

[features]
# The engine polling XInput itself on Windows. Off: the game hands it the pad,
# and it defines XInputGetState of its own (port/linux/src/xinput_sdl.c).
xinput = []
