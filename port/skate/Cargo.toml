# Skate 3 mode (see README.md): the C library the Linux build links, and the
# skate engine it wraps.
[workspace]
resolver = "3"
members = [
    "halo-skate",
    "vendor/skate-core",
    "vendor/skate-data",
    "vendor/skate-host",
    "vendor/skate-net",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "vendor/skate-core" }
skate-data = { path = "vendor/skate-data" }

[profile.release]
debug = 1
