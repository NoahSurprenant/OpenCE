name: Stream image

# The stream's container image (docker/server/Dockerfile, target stream: the server's build as a
# client in stream mode, with 32-bit Mesa (llvmpipe), ffmpeg and docker/stream/stream.sh;
# port/linux/README.md, "Streaming"): built for every pull request and push that changes the game or
# the image; on main also pushed to ghcr.io/noahsurprenant/opence-stream and signed keyless with
# cosign (Sigstore, this workflow's GitHub identity). Weekly as well, so the image picks up Debian's
# fixes. Its build stage is the server image's (server-image.yml), so the two share the build cache.
#
# Tags: sha-<commit> for each build of main, then :latest moved to it once it is pushed and signed.
# A deployment can follow :latest by digest (Argo CD Image Updater, say) or pin a sha- tag.
#
# Verify:
#   cosign verify ghcr.io/noahsurprenant/opence-stream:latest \
#     --certificate-identity-regexp '^https://github\.com/NoahSurprenant/OpenCE/\.github/workflows/stream-image\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", "docker/web/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml", ".github/workflows/helm-chart-web.yml", ".github/workflows/server-image.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", "docker/web/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml", ".github/workflows/helm-chart-web.yml", ".github/workflows/server-image.yml"]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: stream-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/noahsurprenant/opence-stream

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token gets a short-lived Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only the immutable sha- tag here; :latest moves below, once the image is pushed and signed.
          tags: |
            type=sha

      # Built and loaded first, on every event, so that the image is started before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          target: stream
          platforms: linux/amd64
          load: true
          tags: opence-stream:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # There are no maps in CI (they are never published), and the game needs real ones, so this
      # checks the image around it: the game finds the portable build's SDL beside it and every other
      # library it links; ffmpeg has libx264 and the HLS muxer. Then, started as uid 10001 on a
      # read-only root with no maps, the script makes its FIFOs and starts the game and ffmpeg: the
      # game draws with OpenGL on llvmpipe (its error screen: it has no maps) and ffmpeg writes HLS
      # segments of it; docker stop (SIGTERM) stops both and the container exits 0.
      # tools/test_stream.py runs the stream itself, with maps, on the owner's runner.
      - name: Smoke test
        run: |
          set -euo pipefail
          [ "$(docker image inspect -f '{{.Config.User}}' opence-stream:ci)" = 10001:10001 ]
          docker run --rm --entrypoint /bin/sh opence-stream:ci -c '
            set -e
            ldd /opt/opence/halo | grep -q "libSDL3.so.0 => /opt/opence/libSDL3.so.0"
            if ldd /opt/opence/halo | grep "not found"; then exit 1; fi
            test -e /usr/lib/i386-linux-gnu/libEGL.so.1
            ffmpeg -hide_banner -encoders | grep -q libx264
            ffmpeg -hide_banner -muxers | grep -qw hls'
          docker run -d --name stream --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:uid=10001,gid=10001 --tmpfs /tmp:uid=10001,gid=10001 --tmpfs /hls:uid=10001,gid=10001 \
            -e STREAM_SERVER=127.0.0.1 opence-stream:ci > /dev/null
          segments=0
          for _ in $(seq 1 30); do
            segments=$(docker exec stream sh -c 'grep -cs "^live[0-9]*\.ts$" /hls/live.m3u8' || true)
            [ "${segments:-0}" -lt 3 ] || break
            sleep 2
          done
          docker stop -t 10 stream > /dev/null
          status=$(docker inspect -f '{{.State.ExitCode}}' stream)
          docker logs stream > stream.log 2>&1
          docker rm stream > /dev/null
          cat stream.log
          grep -qF 'stream.sh: watching 127.0.0.1 (127.0.0.1): 854x480 at 30 fps to /hls/live.m3u8' stream.log
          grep -q 'OpenGL .* on llvmpipe' stream.log || { echo "::error::the game did not draw with llvmpipe"; exit 1; }
          grep -qF 'stream: streaming (the first frame' stream.log
          [ "${segments:-0}" -ge 3 ] || { echo "::error::ffmpeg wrote ${segments:-0} segments, not 3"; exit 1; }
          grep -qF 'stream.sh: stopping' stream.log
          [ "$status" = 0 ] || { echo "::error::the stream exited with $status after SIGTERM, not 0"; exit 1; }

      # Two renditions (STREAM_RENDITIONS_CPU: no GPU in CI, so stream.sh's VAAPI preflight fails and
      # this is the list it actually encodes with): a master playlist (ffmpeg's own, #EXT-X-STREAM-INF)
      # at live.m3u8, and each of the two variants getting its own segments.
      - name: Smoke test - multi-rendition (CPU)
        run: |
          set -euo pipefail
          docker run -d --name stream-multi --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:uid=10001,gid=10001 --tmpfs /tmp:uid=10001,gid=10001 --tmpfs /hls:uid=10001,gid=10001 \
            -e STREAM_SERVER=127.0.0.1 \
            -e STREAM_RENDITIONS_CPU="480p:320:180:400k 360p:160:90:200k" \
            opence-stream:ci > /dev/null
          ready=0
          master=0
          for _ in $(seq 1 30); do
            a=$(docker exec stream-multi sh -c 'grep -cs "^live[^/]*\.ts$" /hls/live_480p.m3u8' || true)
            b=$(docker exec stream-multi sh -c 'grep -cs "^live[^/]*\.ts$" /hls/live_360p.m3u8' || true)
            docker exec stream-multi sh -c "grep -qs '^#EXT-X-STREAM-INF' /hls/live.m3u8" && master=1 || master=0
            if [ "${a:-0}" -ge 3 ] && [ "${b:-0}" -ge 3 ] && [ "$master" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          docker stop -t 10 stream-multi > /dev/null
          status=$(docker inspect -f '{{.State.ExitCode}}' stream-multi)
          docker logs stream-multi > stream-multi.log 2>&1
          docker rm stream-multi > /dev/null
          cat stream-multi.log
          grep -qF 'stream.sh: renditions (2, libx264)' stream-multi.log
          [ "$master" = 1 ] || { echo "::error::live.m3u8 is not a master playlist (#EXT-X-STREAM-INF)"; exit 1; }
          [ "$ready" = 1 ] || { echo "::error::ffmpeg did not write 3 segments to each rendition's playlist"; exit 1; }
          [ "$status" = 0 ] || { echo "::error::the stream exited with $status after SIGTERM, not 0"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      # The same build, from the cache, pushed.
      - name: Push
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          target: stream
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sign, verify, and move latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/stream-image\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          # Metadata only: :latest now names the signed image.
          docker buildx imagetools create -t "$IMAGE:latest" "$ref"
          {
            echo "Pushed and signed $ref, now also $IMAGE:latest."
            echo
            echo "Verify: cosign verify $IMAGE:latest --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
