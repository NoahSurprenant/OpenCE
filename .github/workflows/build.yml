name: Build

# Debug and release builds of the native ports (Linux, Windows, Android) and
# the web port for every pushed commit, uploaded as artifacts.
# tools/ci_build.py does each build; see it for the options.
#
# Kept cheap:
# - one job per platform builds both configurations, so its set-up (tools,
#   downloads, caches) is paid once;
# - compiles go through ccache, whose cache carries over from run to run, so
#   a commit only recompiles what it changed; downloads (SDL, musl, Gradle,
#   the Linux build's system root) are cached too;
# - a newer push to the same branch cancels a run still going;
# - pushes that only change documentation, the charts, or the dedicated
#   server's image, do not build;
# - Windows, whose minutes cost twice Linux's, builds only Windows;
# - artifacts are kept for three days.
#
# A successful build of main is also published as a GitHub release, the
# newest marked latest, so that
# https://github.com/<repository>/releases/latest/download/<file> always
# gives the latest build; the last five are kept. The web build is then the
# site on GitHub Pages (port/web/README.md, "Hosting"): upstream's at
# https://halocombatevolved.com/, this fork's (NoahSurprenant/OpenCE) at
# https://noahsurprenant.github.io/OpenCE/.
on:
  push:
    paths-ignore:
      - "**.md"
      # The charts and the server's image have workflows of their own (helm-chart.yml,
      # helm-chart-web.yml, server-image.yml, which builds the game in the image). The web
      # image (docker/web/) is built here, by web-image with the web job's site, so a change
      # to it builds.
      - "charts/**"
      - "docker/server/**"
      - ".github/workflows/helm-chart.yml"
      - ".github/workflows/helm-chart-web.yml"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Also build the profiling flavour (configure.py --profile) on Linux"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  linux:
    # Arch Linux has what the build needs as packages: clang 22 (for the
    # profile-guided optimisation in pgo/), and CMake, pkg-config and
    # wayland-scanner for the SDL 3 that the portable build brings. The build
    # links against Debian 11's 32-bit glibc (tools/linux_sysroot.py), not
    # Arch's, so that it starts on SteamOS and older distributions; Arch's
    # 32-bit glibc is for the tests.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git zstd python python-pytest ninja ccache \
            clang lld gcc lib32-glibc lib32-gcc-libs cmake pkgconf wayland rustup
          # Skate 3 mode's engine (port/skate), for the game's 32-bit ABI
          rustup default stable
          rustup target add i686-unknown-linux-gnu

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      # the skate engine as cargo built it, and the crates it was built from
      - uses: actions/cache@v4
        with:
          path: |
            port/skate/target
            ~/.cargo/registry
          key: skate-linux-${{ hashFiles('port/skate/**/Cargo.lock', 'port/skate/**/*.rs', 'port/skate/**/Cargo.toml') }}
          restore-keys: skate-linux-

      # the system root and SDL's source, which the build downloads
      - uses: actions/cache@v4
        with:
          path: build/linux/third_party
          key: linux-third-party-${{ hashFiles('tools/linux_sysroot.py') }}

      - name: Debug
        run: python tools/ci_build.py linux debug

      # (the profiling build, configure.py --profile, which no other step
      # compiles: only when a run started by hand asks for it, as it costs a
      # build of its own)
      - name: Profile
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        run: python tools/ci_build.py linux profile

      - name: Release
        run: python tools/ci_build.py linux release

      - name: Test
        run: |
          python -m pytest -q tools/test_linux_port.py tools/test_host_watch_hash.py tools/test_touch_menu.py tools/harness tools/test_profile.py port/skate/converter
          python tools/test_light_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-debug
          path: dist/halo-linux-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-linux-release
          path: dist/halo-linux-release
          retention-days: 3

  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # the app's signing key, from the ANDROID_KEYSTORE_BASE64 secret (a
      # keystore, base64) and ANDROID_KEYSTORE_PASSWORD (its password, and
      # the key's, alias halo): every build signed with it installs over the
      # one before, as the app's self-updater (Updater.java) needs. Without
      # them each build is signed with the runner's own debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the Android builds cannot update over each other"
          fi

      - name: Debug
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android debug

      - name: Release
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android release

      # the touch controls' layout and gyroscope maths (the runner's JDK)
      - name: Test the touch layout
        run: python3 tools/test_touch_layout.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-debug
          path: dist/halo-android-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: dist/halo-android-release
          retention-days: 3

  windows:
    # The runner image has LLVM, Python and Visual Studio's x86 libraries and
    # Windows SDK.
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # the skate engine as cargo built it, and the crates it was built from
      - uses: actions/cache@v4
        with:
          path: |
            port/skate/target
            ~/.cargo/registry
          key: skate-windows-${{ hashFiles('port/skate/**/Cargo.lock', 'port/skate/**/*.rs', 'port/skate/**/Cargo.toml') }}
          restore-keys: skate-windows-

      # Skate 3 mode's engine (port/skate), for the game's 32-bit ABI (the
      # runner image has rustup)
      - name: Rust target
        run: rustup target add i686-pc-windows-msvc

      # SDL's development package, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: Debug
        run: python tools/ci_build.py windows debug

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Test light storage
        run: python tools/test_light_storage.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-debug
          path: dist/halo-windows-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-release
          path: dist/halo-windows-release
          retention-days: 3

      # the PDBs, for crash reports' backtraces (tools/ci_build.py)
      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-debug-symbols
          path: dist/halo-windows-debug-symbols
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-release-symbols
          path: dist/halo-windows-release-symbols
          retention-days: 3

  skate-assets:
    # Skate 3 mode's engine tests against the real Skate 3 data
    # (port/skate/halo-skate/tests/real_assets*.rs; port/skate/README.md), which
    # GitHub's runners cannot have: the owner's own runner, opence-k8s (the
    # arc-opence runner set in the owner's homelab), has it read-only at
    # /skate-assets. It holds nothing else - no secrets, no way into the
    # owner's network - but it can read the data, so it only runs this
    # repository's own code: pushes and runs started by hand (both need write
    # access), and - should this workflow ever run for pull requests - only
    # pull requests from this repository's branches, never a fork's, and only
    # ever pull_request, never pull_request_target. Outside contributors'
    # workflows also wait for approval (the repository's Actions settings): a
    # fork's pull request could bring a workflow of its own with
    # runs-on: opence-k8s. Only in NoahSurprenant/OpenCE, the one repository
    # the runner serves: in a fork, or upstream, the job would wait for a
    # runner that never comes.
    #
    # Not needed by release or notify: the release is the six builds, which
    # do not depend on the data, and the runner is one machine at home - when
    # it is down or busy, main still gets its release. A failure here still
    # fails the run.
    if: >-
      github.repository == 'NoahSurprenant/OpenCE' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: opence-k8s
    timeout-minutes: 30
    env:
      HALO_SKATE_TEST_ASSETS: /skate-assets/skate-data/assets
      # the owner's Halo Xbox maps, for the real-level tests
      # (real_assets_halo_map.rs reads Hang 'Em High's collision from its map)
      HALO_SKATE_TEST_HALO_MAPS: /skate-assets/halo/maps
      # the extracted game, for Skate 3's own sounds (extract_sounds.py)
      SKATE3_GAME: /skate-assets/skate3-original
    steps:
      # The tests pass without running when the data is not there; on this
      # runner that would be a silent no, so check first.
      - name: Skate 3 data
        run: |
          if [ ! -d "$HALO_SKATE_TEST_ASSETS/private" ]; then
            echo "::error::no converted Skate 3 data at $HALO_SKATE_TEST_ASSETS (the runner's /skate-assets mount is missing or empty)"
            exit 1
          fi
          ls "$HALO_SKATE_TEST_ASSETS"
          if [ ! -f "$SKATE3_GAME/data/audio/audiofiles.big" ]; then
            echo "::error::no extracted Skate 3 at $SKATE3_GAME (the runner's /skate-assets mount is missing or empty)"
            exit 1
          fi
          if [ ! -f "$HALO_SKATE_TEST_HALO_MAPS/hangemhigh.map" ]; then
            echo "::error::no Halo maps at $HALO_SKATE_TEST_HALO_MAPS (the runner's /skate-assets mount is missing or empty)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Skate 3's own sounds (port/skate/README.md, "Skate 3's own sounds"),
      # written from the game by port/skate/converter/extract_sounds.py into
      # the job's temporary folder, for the sound tests below
      # (HALO_SKATE_TEST_SOUNDS). They are the game's: never uploaded (this
      # job has no artifacts), and the runner's temporary folder goes with
      # the job. vgmstream-cli decodes them: its official static Linux build
      # (FFmpeg included, for Skate 3's XMA), a pinned release checked
      # against its SHA-256; the runner image has the Python 3 and unzip it
      # needs.
      - name: Skate 3's sounds
        env:
          VGMSTREAM_URL: https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip
          VGMSTREAM_SHA256: 2f98c77f756079f63fbd119939067f1ed461d77e70993bc4cc372736d859c84a
        run: |
          mkdir -p "$RUNNER_TEMP/vgmstream"
          curl -fsSL -o "$RUNNER_TEMP/vgmstream.zip" "$VGMSTREAM_URL"
          echo "$VGMSTREAM_SHA256  $RUNNER_TEMP/vgmstream.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/vgmstream.zip" -d "$RUNNER_TEMP/vgmstream"
          chmod +x "$RUNNER_TEMP/vgmstream/vgmstream-cli"
          sounds="$RUNNER_TEMP/skate-data/sounds"
          python3 port/skate/converter/extract_sounds.py "$SKATE3_GAME" "$sounds" \
            --vgmstream "$RUNNER_TEMP/vgmstream/vgmstream-cli"
          echo "HALO_SKATE_TEST_SOUNDS=$sounds" >> "$GITHUB_ENV"

      # the engine as cargo built it for the host, and the crates it was
      # built from; the runner starts empty each job, and both paths are on
      # its writable home ($CARGO_HOME is ~/.cargo there)
      - uses: actions/cache@v4
        with:
          path: |
            port/skate/target
            ~/.cargo/registry
          key: skate-assets-${{ hashFiles('port/skate/**/Cargo.lock', 'port/skate/**/*.rs', 'port/skate/**/Cargo.toml') }}
          restore-keys: skate-assets-

      # As the README says, every real-data test file
      # (halo-skate/tests/real_assets*.rs: real_assets, real_assets_camera,
      # real_assets_sound, real_assets_halo_map, and any added later) in one
      # cargo test, the sound tests with Skate 3's own sounds; a test that
      # says it skipped, in any of them, fails the job too.
      - name: Test
        working-directory: port/skate
        run: |
          set -o pipefail
          tests=()
          for f in halo-skate/tests/real_assets*.rs; do
            tests+=(--test "$(basename "$f" .rs)")
          done
          echo "real-data tests: ${tests[*]}"
          cargo test --release -p halo-skate "${tests[@]}" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/real_assets.log"
          if grep -q 'skipped, HALO_SKATE_TEST_ASSETS' "$RUNNER_TEMP/real_assets.log"; then
            echo "::error::a test skipped: HALO_SKATE_TEST_ASSETS did not reach it"
            exit 1
          fi
          if grep -q 'skipped, HALO_SKATE_TEST_SOUNDS' "$RUNNER_TEMP/real_assets.log"; then
            echo "::error::a test skipped: HALO_SKATE_TEST_SOUNDS did not reach it"
            exit 1
          fi
          if grep -q 'skipped, HALO_SKATE_TEST_HALO_MAPS' "$RUNNER_TEMP/real_assets.log"; then
            echo "::error::a test skipped: HALO_SKATE_TEST_HALO_MAPS did not reach it"
            exit 1
          fi

      # (the runner empties its temporary folder after each job anyway)
      - name: Remove Skate 3's sounds
        if: always()
        run: rm -rf "$RUNNER_TEMP/skate-data" "$RUNNER_TEMP/vgmstream" "$RUNNER_TEMP/vgmstream.zip"

  skate-multiplayer:
    # Skate 3 mode in a network game, two real games (a host and a client
    # skating) on one machine: tools/test_linux_port.py's
    # test_skate_multiplayer (port/skate/README.md, "Testing multiplayer"),
    # a dedicated server with a client joining it and SIGTERM stopping it
    # (test_dedicated_server, port/linux/README.md's "Dedicated server"), and
    # a dedicated server built without --skate, as the server image is, with
    # two skating clients (test_dedicated_server_skaters: it relays their
    # states and decides their hits with no Skate 3 data of its own), and
    # that server through two turns of its map list with one-minute games
    # (test_dedicated_server_rotation: each game's end, scores and the next
    # map's game, about three minutes and a half). They
    # need the converted Skate 3 data and the Halo maps - so on the owner's
    # runner, opence-k8s, for the reasons skate-assets gives above, and only
    # for this repository's own code, as skate-assets. The runner serves one
    # job at a time, so the two take turns. test_dedicated_server_without_maps
    # (the server's refusal to start without its maps) runs here too, and in
    # the linux job.
    # test_skate_hitbox (a skater hit where their body is drawn, a minute and
    # a half: port/skate/README.md, "Where a skater is hit") too.
    #
    # The game is the Linux build CI makes as debug (tools/ci_build.py:
    # --skate --lto=off --pgo=off), and the server of
    # test_dedicated_server_skaters the image's (docker/server/Dockerfile:
    # --release --lto=off --pgo=off), both without --portable (below), 32-bit, headless: the runner
    # has no display or sound, so SDL's dummy drivers and the null renderer
    # (HALO_NULL_RENDERER, which the test sets). Not needed by release or
    # notify, as skate-assets.
    if: >-
      github.repository == 'NoahSurprenant/OpenCE' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: opence-k8s
    timeout-minutes: 30
    env:
      HALO_SKATE_TEST_ASSETS: /skate-assets/skate-data/assets
      HALO_SKATE_TEST_HALO_MAPS: /skate-assets/halo/maps
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      # The test passes without running when the data is not there; on this
      # runner that would be a silent no, so check first.
      - name: Skate 3 data and Halo maps
        run: |
          if [ ! -d "$HALO_SKATE_TEST_ASSETS/private" ]; then
            echo "::error::no converted Skate 3 data at $HALO_SKATE_TEST_ASSETS (the runner's /skate-assets mount is missing or empty)"
            exit 1
          fi
          if [ ! -f "$HALO_SKATE_TEST_HALO_MAPS/bloodgulch.map" ]; then
            echo "::error::no Halo maps at $HALO_SKATE_TEST_HALO_MAPS (the runner's /skate-assets mount is missing or empty)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # the compile cache (ninja rebuilds a fresh checkout whole; ccache
      # makes that cheap), and the skate engine as cargo built it for the
      # game (port/skate/target/i686-unknown-linux-gnu) with the crates it was
      # built from; apart from skate-assets' caches, which hold the engine
      # built for the host
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-skate-mp-${{ github.sha }}
          restore-keys: ccache-skate-mp-

      - uses: actions/cache@v4
        with:
          path: |
            port/skate/target
            ~/.cargo/registry
          key: skate-mp-${{ hashFiles('port/skate/**/Cargo.lock', 'port/skate/**/*.rs', 'port/skate/**/Cargo.toml') }}
          restore-keys: skate-mp-

      # (not --portable, as tools/ci_build.py builds: that builds its own SDL 3
      # against a downloaded system root, which needs CMake and wayland-scanner,
      # and the runner has neither; it has a 32-bit SDL 3 of its own. Built
      # for this machine, which runs it)
      - name: Build
        run: |
          python3 configure.py --skate --lto=off --pgo=off --compiler-launcher ccache
          ninja linux
          cp build/linux/halo "$RUNNER_TEMP/halo-skate"

      # the dedicated server as the server image builds it: no Skate 3 mode
      - name: Build the server
        run: |
          python3 configure.py --release --lto=off --pgo=off --compiler-launcher ccache
          ninja linux
          cp build/linux/halo "$RUNNER_TEMP/halo-server"

      # a skip fails the job too: on this runner it would mean the data or
      # the game did not reach the test. The test stops both games itself;
      # the last step makes sure.
      - name: Test
        env:
          HALO_TEST_GAME: ${{ runner.temp }}/halo-skate
          HALO_TEST_SERVER: ${{ runner.temp }}/halo-server
        run: |
          set -o pipefail
          python3 -m pytest -v -rs -p no:cacheprovider --basetemp="$RUNNER_TEMP/skate-mp" \
            tools/test_linux_port.py -k "test_skate_multiplayer or test_skate_hitbox or test_dedicated_server" 2>&1 | tee "$RUNNER_TEMP/skate-mp.log"
          if ! grep -q '6 passed' "$RUNNER_TEMP/skate-mp.log" || grep -qi 'skipped' "$RUNNER_TEMP/skate-mp.log"; then
            echo "::error::test_skate_multiplayer, test_skate_hitbox and the four test_dedicated_server tests did not all run and pass"
            exit 1
          fi

      - name: Compile cache
        run: ccache --show-stats

      # the games' logs, on failure (they hold no Skate 3 data, only the
      # games' own lines)
      - name: Game logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/skate-mp/*/*/run.log; do
            [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f"; }
          done
          true

      - name: Stop the games
        if: always()
        run: |
          pkill -KILL -f "$RUNNER_TEMP/halo-" || true
          rm -rf "$RUNNER_TEMP/skate-mp" "$RUNNER_TEMP/skate-mp.log" "$RUNNER_TEMP/halo-skate" "$RUNNER_TEMP/halo-server"

  web-dedicated:
    # A browser joining the dedicated server by its invite
    # (port/web/tests/dedicated.mjs; port/linux/README.md, "Dedicated
    # server"): the server as the server image builds it (invite-only), a
    # local MQTT broker, and the web job's site in a headless Chromium, which
    # imports ui.map and bloodgulch.map and joins the server over WebRTC
    # through a UDP forward that stands in for a router's port forward
    # (network.public_address). The server must log the player joining and
    # its WebRTC connection, the browser its player each second, and the
    # browser's chosen ICE path must be the forward. Everything runs on the
    # runner, on its loopback and its own address; the test's server asks no
    # STUN server. It needs the Halo maps, so on the owner's runner,
    # opence-k8s, for the reasons skate-assets gives above and with its
    # conditions. The runner's image has Node, Playwright 1.58 with its
    # Chromium headless shell, and mosquitto. After web, whose site it tests;
    # not needed by release or notify, as skate-assets. About two minutes:
    # the server builds in about 30 seconds and the test takes about 30.
    needs: web
    if: >-
      github.repository == 'NoahSurprenant/OpenCE' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: opence-k8s
    timeout-minutes: 15
    env:
      HALO_MAPS: /skate-assets/halo/maps
    steps:
      # the test needs all of these; on this runner a missing one is a
      # broken runner, not a reason to skip
      - name: Halo maps, Node, Playwright and mosquitto
        run: |
          for map in ui.map bloodgulch.map; do
            if [ ! -f "$HALO_MAPS/$map" ]; then
              echo "::error::no $map at $HALO_MAPS (the runner's /skate-assets mount is missing or empty)"
              exit 1
            fi
          done
          node --version
          node -e "require('playwright')" || { echo "::error::the runner's Node has no Playwright"; exit 1; }
          command -v mosquitto || { echo "::error::the runner has no mosquitto"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: halo-web-release
          path: ${{ runner.temp }}/halo-web-release

      # (not --portable, as skate-multiplayer builds it)
      - name: Build the server
        run: |
          python3 configure.py --release --lto=off --pgo=off
          ninja linux

      - name: Test
        run: |
          set -o pipefail
          node port/web/tests/dedicated.mjs "$RUNNER_TEMP/halo-web-release" "$HALO_MAPS" build/linux/halo 2>&1 |
            tee "$RUNNER_TEMP/web-dedicated.log"
          if ! grep -q '^a browser on the dedicated server: ok$' "$RUNNER_TEMP/web-dedicated.log"; then
            echo "::error::the browser did not join and play on the dedicated server"
            exit 1
          fi

      - name: Stop the server
        if: always()
        run: |
          pkill -KILL -f "$GITHUB_WORKSPACE/build/linux/halo" || true
          pkill -KILL -x mosquitto || true
          rm -f "$RUNNER_TEMP/web-dedicated.log"

  web-skate:
    # Skate 3 mode in a browser (port/web/tests/skate.mjs; port/skate/README.md,
    # "In a browser"): the web job's site in a headless Chromium imports the
    # owner's Halo maps (ui.map and bloodgulch.map) and converted Skate 3
    # data through the page's two importers, into the browser's throwaway
    # profile, and hosts a game on Blood Gulch alone; J gets on the board and
    # both sticks clicked in on a stand-in controller (the Gamepad API) get
    # off. The game's log must show the skater preloaded from the imported
    # data, the level sent to the engine with its rails, the pose finite and
    # the board drawn each second (debug.skate_status), and sounds from the
    # imported folder. Then again without skate data, where J must say there
    # is none and the game play on. It needs the maps and the data, so on the
    # owner's runner, opence-k8s, for the reasons skate-assets gives above and
    # with its conditions; nothing of them leaves it (no screenshots, no
    # artifacts; the game is offline: debug.network_test hosts system link,
    # network.online off). After web, whose site it tests; not needed by
    # release or notify, as skate-assets. About four minutes, most of it the
    # import and the skater's preload in Chromium's software renderer.
    needs: web
    if: >-
      github.repository == 'NoahSurprenant/OpenCE' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: opence-k8s
    timeout-minutes: 20
    env:
      HALO_MAPS: /skate-assets/halo/maps
      SKATE_DATA: /skate-assets/skate-data
    steps:
      # the test needs all of these; on this runner a missing one is a
      # broken runner, not a reason to skip
      - name: Halo maps, Skate 3 data, Node and Playwright
        run: |
          for map in ui.map bloodgulch.map; do
            if [ ! -f "$HALO_MAPS/$map" ]; then
              echo "::error::no $map at $HALO_MAPS (the runner's /skate-assets mount is missing or empty)"
              exit 1
            fi
          done
          for file in assets/board.json sounds; do
            if [ ! -e "$SKATE_DATA/$file" ]; then
              echo "::error::no $file in $SKATE_DATA (the runner's /skate-assets mount is missing or empty)"
              exit 1
            fi
          done
          node --version
          node -e "require('playwright')" || { echo "::error::the runner's Node has no Playwright"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: halo-web-release
          path: ${{ runner.temp }}/halo-web-release

      - name: Test
        run: |
          set -o pipefail
          node port/web/tests/skate.mjs "$RUNNER_TEMP/halo-web-release" "$HALO_MAPS" "$SKATE_DATA" 2>&1 |
            tee "$RUNNER_TEMP/web-skate.log"
          if ! grep -q '^skate in a browser: ok$' "$RUNNER_TEMP/web-skate.log"; then
            echo "::error::Skate 3 mode did not work in the browser"
            exit 1
          fi
          node port/web/tests/skate.mjs "$RUNNER_TEMP/halo-web-release" "$HALO_MAPS" none 2>&1 |
            tee "$RUNNER_TEMP/web-skate.log"
          if ! grep -q '^skate in a browser without skate data: ok$' "$RUNNER_TEMP/web-skate.log"; then
            echo "::error::without skate data, J in the browser did not say so, or the game did not play on"
            exit 1
          fi

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/web-skate.log"

  web:
    # Emscripten (emsdk, the version below, cached) builds the web port's
    # site (port/web/README.md), with Skate 3 mode (its engine with the
    # pinned nightly Rust, below; the site holds no skate data, which each
    # player imports, nor game data); the tests check its graph, the page's
    # importer and service worker, its sockets, that it starts in a
    # headless Chromium (with no game data, as far as the menus' map), and
    # that two browsers join a room through a local MQTT broker, and that
    # the page takes the game data from its own server when one opts in
    # (server-data.json, with placeholder files).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/halo_sdl3.py') }}

      - name: Install the toolchain
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache python3-pytest mosquitto

      # Skate 3 mode (configure.py --skate, which tools/ci_build.py gives the
      # web build): its engine needs the nightly Rust tools/web_build.py pins,
      # with its standard library's source, which it builds for Emscripten's
      # target with atomics (port/web/README.md, "Building"). The nightly, the
      # crates and the engine's build are cached; a change to port/skate
      # starts from the last cache and rebuilds what changed.
      - name: The skate engine's Rust
        run: |
          toolchain=$(python3 -c "from tools.web_build import SKATE_WEB_TOOLCHAIN; print(SKATE_WEB_TOOLCHAIN)")
          echo "SKATE_WEB_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/${{ env.SKATE_WEB_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ env.SKATE_WEB_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            build/web/skate
          key: web-skate-${{ env.SKATE_WEB_TOOLCHAIN }}-${{ hashFiles('port/skate/Cargo.lock', 'port/skate/.cargo/config.toml', 'port/skate/**/Cargo.toml', 'port/skate/**/*.rs') }}
          restore-keys: web-skate-${{ env.SKATE_WEB_TOOLCHAIN }}-

      - name: Install the skate engine's Rust
        run: rustup toolchain install "$SKATE_WEB_TOOLCHAIN" --profile minimal --component rust-src

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Debug
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web debug

      - name: Release
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 tools/ci_build.py web release

      - name: Test
        run: |
          source ~/emsdk/emsdk_env.sh
          node --test "port/web/tests/*.test.js"
          python3 -m pytest -q tools/test_web_build.py tools/test_web_server_data_manifest.py

      - name: Test in Chromium and Firefox
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright@1.58
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium firefox
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/smoke.mjs dist/halo-web-release
          # (under a sub-path too, as GitHub Pages serves a site without a domain)
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/smoke.mjs dist/halo-web-release --base /OpenCE/
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/rooms.mjs dist/halo-web-release
          # (the game data from the site's own server, opt-in: a stand-in set of placeholder files)
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/server-data.mjs dist/halo-web-release 2>&1 |
            tee "$RUNNER_TEMP/server-data.log"
          grep -q '^server data in a browser: ok$' "$RUNNER_TEMP/server-data.log"
          # (the native builds' WebRTC, port/linux/src/p2p_webrtc.c, with both)
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node port/web/tests/webrtc_native.mjs chromium firefox

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-debug
          path: dist/halo-web-debug
          include-hidden-files: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web-release
          path: dist/halo-web-release
          include-hidden-files: true
          retention-days: 3

  web-image:
    # The site as a container image (docker/web/Dockerfile: nginx with the
    # headers the game needs, and the manifest script of a private server;
    # charts/opence-web deploys it): the web job's release build put in the
    # image, which is started and checked (docker/web/smoke-test.sh: the
    # cross-origin isolation headers, halo.wasm's type, a Range request,
    # the 404s of a site without game data, then placeholder game data in
    # tmpfs folders, never real ones). On main (this fork only) also pushed
    # to ghcr.io/noahsurprenant/opence-web as sha-<commit>, signed keyless
    # with cosign, and :latest moved to it, as server-image.yml does for the
    # server's image. Verify:
    #   cosign verify ghcr.io/noahsurprenant/opence-web:latest \
    #     --certificate-identity-regexp '^https://github\.com/NoahSurprenant/OpenCE/\.github/workflows/build\.yml@refs/heads/main$' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
    # Not needed by release or notify. About a minute.
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token gets a short-lived Sigstore certificate.
      id-token: write
    env:
      IMAGE: ghcr.io/noahsurprenant/opence-web
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.repository == 'NoahSurprenant/OpenCE' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: halo-web-release
          path: ${{ runner.temp }}/halo-web-release

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only the immutable sha- tag here; :latest moves below, once the image is pushed and signed.
          tags: |
            type=sha

      # Built and loaded first, so that the image is started before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web/Dockerfile
          build-contexts: site=${{ runner.temp }}/halo-web-release
          platforms: linux/amd64
          load: true
          tags: opence-web:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: docker/web/smoke-test.sh opence-web:ci

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      # The same build, from the builder's cache, pushed.
      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web/Dockerfile
          build-contexts: site=${{ runner.temp }}/halo-web-release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign, verify, and move latest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/build\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          # Metadata only: :latest now names the signed image.
          docker buildx imagetools create -t "$IMAGE:latest" "$ref"
          {
            echo "Pushed and signed $ref, now also $IMAGE:latest."
            echo
            echo "Verify: cosign verify $IMAGE:latest --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # The eight builds (and the Windows builds' PDBs) as a release, tagged
    # build-<run number> and marked latest
    # (every file keeps its name from release to release, for the README's
    # latest/download links); then all but the newest five build-* releases
    # go, tags and all. Only for main, and only when every platform built.
    needs: [linux, android, windows, web]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: halo-*
          path: artifacts

      - name: Package
        run: |
          mkdir release
          for build in artifacts/*/; do
            name="$(basename "$build")"
            (cd "$build" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          ls -l release

      - name: Publish
        id: publish
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1)"
          printf '%s\n\nCommit: %s\nBuild: %s\n\nThe release builds are for playing; the debug builds stop at the first failed assertion and log it.\n' \
            "$subject" "$COMMIT_URL" "$RUN_URL" > notes.md
          gh release create "$tag" release/*.zip --target "$GITHUB_SHA" --latest \
            --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The Windows builds' executables and PDBs to Sentry, which turns the
      # crash reports of these builds (port/windows/src/win32_crash.c) into
      # backtraces with function names and lines. Needs the SENTRY_AUTH_TOKEN
      # secret: an organization auth token of the Sentry organization, which
      # names the organization and its region itself. The SENTRY_PROJECT
      # variable can name the project (its slug), else the id in the DSN of
      # win32_crash.c; SENTRY_ORG and SENTRY_URL (https://de.sentry.io) are
      # for a personal token instead. A failed upload does not stop the
      # release.
      - name: Upload Windows symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || '4512207917744208' }}
          ORG: ${{ vars.SENTRY_ORG }}
          URL: ${{ vars.SENTRY_URL }}
          SENTRY_CLI_VERSION: 2.46.0
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::no SENTRY_AUTH_TOKEN secret: crash reports of this build will have no function names"
            exit 0
          fi
          if [ -n "$ORG" ]; then export SENTRY_ORG="$ORG"; fi
          if [ -n "$URL" ]; then export SENTRY_URL="$URL"; fi
          curl -fsSL -o sentry-cli "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64"
          chmod +x sentry-cli
          ./sentry-cli debug-files upload --wait \
            artifacts/halo-windows-release artifacts/halo-windows-release-symbols \
            artifacts/halo-windows-debug artifacts/halo-windows-debug-symbols

      - name: Keep the last five
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

  pages:
    # The release's web build to GitHub Pages (port/web/README.md, "Hosting"),
    # which serves upstream's at https://halocombatevolved.com/ and this
    # fork's at https://noahsurprenant.github.io/OpenCE/ (a sub-path: the
    # site's addresses are all relative, and the smoke test runs there). Only
    # main, only once every platform built and the release is out (the site
    # and the release are one build), and a deployment is never cancelled
    # halfway. The repository's Pages source must be GitHub Actions.
    #
    # Only the repositories with a Pages site: upstream
    # (OpenCommunityEdition/OpenCE) and this fork (NoahSurprenant/OpenCE).
    # Another fork has none, and its release is enough.
    needs: [release]
    if: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["OpenCommunityEdition/OpenCE","NoahSurprenant/OpenCE"]'), github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: halo-web-release
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  notify:
    # A Discord embed for the run, to the DISCORD_WEBHOOK secret (nothing
    # without it): green when every platform built, red when one did not,
    # with each platform's result, this run's release (main only), and links
    # to the latest release's builds and the site.
    needs: [linux, android, windows, web, release, pages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LINUX: ${{ needs.linux.result }}
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
          WEB: ${{ needs.web.result }}
          PAGES: ${{ needs.pages.result }}
          SITE_URL: ${{ github.repository == 'NoahSurprenant/OpenCE' && 'https://noahsurprenant.github.io/OpenCE/' || 'https://halocombatevolved.com/' }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "no DISCORD_WEBHOOK secret: nothing to post"
            exit 0
          fi
          status() {
            case "$1" in
              success) echo "✅ Built" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              *) echo "➖ Skipped" ;;
            esac
          }
          if [ "$LINUX" = success ] && [ "$ANDROID" = success ] && [ "$WINDOWS" = success ] && [ "$WEB" = success ]; then
            title="Build succeeded"; color=5763719
          else
            title="Build failed"; color=15548997
          fi
          latest="$SERVER/$REPOSITORY/releases/latest"
          downloads="[Linux]($latest/download/halo-linux-release.zip) · [Windows]($latest/download/halo-windows-release.zip) · [Android]($latest/download/halo-android-release.zip) · [Web]($SITE_URL) ([all builds]($latest))"
          if [ -n "$RELEASE_TAG" ]; then
            release="[$RELEASE_TAG]($SERVER/$REPOSITORY/releases/tag/$RELEASE_TAG)"
            if [ "$PAGES" = success ]; then
              release="$release, on [the site]($SITE_URL)"
            fi
          else
            release="None (only a successful build of main makes one)"
          fi
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1 | cut -c1-200)"
          jq -n \
            --arg title "$title" --argjson color "$color" --arg url "$RUN_URL" \
            --arg description "[\`${SHA:0:7}\`]($COMMIT_URL) $subject — $ACTOR ($BRANCH)" \
            --arg release "$release" --arg downloads "$downloads" \
            --arg linux "$(status "$LINUX")" --arg windows "$(status "$WINDOWS")" --arg android "$(status "$ANDROID")" \
            --arg web "$(status "$WEB")" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: $title, url: $url, color: $color, description: $description, timestamp: $timestamp,
              fields: [
                {name: "Linux", value: $linux, inline: true},
                {name: "Windows", value: $windows, inline: true},
                {name: "Android", value: $android, inline: true},
                {name: "Web", value: $web, inline: true},
                {name: "Release", value: $release},
                {name: "Latest release builds", value: $downloads}
              ]
            }]}' > payload.json
          # Discord rate limits webhooks (HTTP 429, with how many seconds to
          # wait in retry_after): wait and try again, a few times. A post
          # still limited, or a network or Discord error, is a warning rather
          # than a failed run; any other answer (a deleted webhook) fails. (At
          # most 5 tries of 15 seconds and 4 waits of 30: inside the job's 5
          # minutes.)
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 15 -o response.json -w '%{http_code}' \
              -H "Content-Type: application/json" -d @payload.json "$WEBHOOK") || code=000
            case "$code" in
              2??)
                exit 0
                ;;
              429)
                wait=$(jq -r '.retry_after // 5' response.json 2>/dev/null || echo 5)
                wait=$(awk -v w="$wait" 'BEGIN { w += 0; if (w < 1) w = 1; if (w > 30) w = 30; printf "%d", w + 0.999 }')
                echo "Discord is rate limiting the webhook; trying again in ${wait}s (attempt $attempt of 5)"
                ;;
              000|5??)
                wait=5
                echo "Discord answered HTTP $code; trying again in ${wait}s (attempt $attempt of 5)"
                ;;
              *)
                echo "::error::Discord answered HTTP $code: $(cat response.json 2>/dev/null)"
                exit 1
                ;;
            esac
            [ "$attempt" -lt 5 ] && sleep "$wait"
          done
          echo "::warning::The Discord post did not go through after 5 attempts (HTTP $code)"
