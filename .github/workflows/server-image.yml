name: Server image

# The dedicated server's container image (docker/server/Dockerfile): built for every pull request and
# push that changes the game or the image; on main also pushed to ghcr.io/noahsurprenant/opence-server
# and signed keyless with cosign (Sigstore, this workflow's GitHub identity). Weekly as well, so the
# image picks up Debian's fixes.
#
# Tags: sha-<commit> for each build of main, then :latest moved to it once it is pushed and signed.
# A deployment can follow :latest by digest (Argo CD Image Updater, say) or pin a sha- tag.
#
# Verify:
#   cosign verify ghcr.io/noahsurprenant/opence-server:latest \
#     --certificate-identity-regexp '^https://github\.com/NoahSurprenant/OpenCE/\.github/workflows/server-image\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", "docker/web/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml", ".github/workflows/helm-chart-web.yml", ".github/workflows/stream-image.yml", "docker/stream/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", "docker/web/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml", ".github/workflows/helm-chart-web.yml", ".github/workflows/stream-image.yml", "docker/stream/**"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/noahsurprenant/opence-server

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token gets a short-lived Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only the immutable sha- tag here; :latest moves below, once the image is pushed and signed.
          tags: |
            type=sha

      # Built and loaded first, on every event, so that the image is started before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opence-server:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # There are no maps in CI (they are never published), and the server needs real ones: started
      # without them, as uid 10001 on a read-only root, it writes its settings to /state, then exits
      # with status 2 at once, saying which maps it looked for where, before its network starts (its
      # tunnel port never bound). tools/test_linux_port.py's test_dedicated_server checks a server
      # with maps (its game, a client joining, its clean stop on SIGTERM) on the owner's runner.
      - name: Smoke test
        run: |
          set -euo pipefail
          [ "$(docker image inspect -f '{{.Config.User}}' opence-server:ci)" = 10001:10001 ]
          status=0
          timeout 30 docker run --name server --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:uid=10001,gid=10001 --tmpfs /tmp opence-server:ci > server.log 2>&1 || status=$?
          cat server.log
          docker rm -f server > /dev/null
          [ "$status" = 2 ] || { echo "::error::the server without maps exited with $status, not 2"; exit 1; }
          grep -qF 'server: no usable maps in /data/maps (looked for ui.map, bloodgulch.map); exiting' server.log
          grep -q 'settings: wrote the defaults to /opt/opence/config.toml' server.log
          grep -q 'settings: a dedicated server, hosting bloodgulch:slayer' server.log
          if grep -q 'Internet play' server.log; then echo "::error::the server's network started"; exit 1; fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      # The same build, from the cache, pushed.
      - name: Push
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sign, verify, and move latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/server-image\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          # Metadata only: :latest now names the signed image.
          docker buildx imagetools create -t "$IMAGE:latest" "$ref"
          {
            echo "Pushed and signed $ref, now also $IMAGE:latest."
            echo
            echo "Verify: cosign verify $IMAGE:latest --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
