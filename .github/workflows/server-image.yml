name: Server image

# The dedicated server's container image (docker/server/Dockerfile): built for every pull request and
# push that changes the game or the image; on main also pushed to ghcr.io/noahsurprenant/opence-server
# and signed keyless with cosign (Sigstore, this workflow's GitHub identity). Weekly as well, so the
# image picks up Debian's fixes.
#
# Tags: sha-<commit> for each build of main, then :latest moved to it once it is pushed and signed.
# A deployment can follow :latest by digest (Argo CD Image Updater, say) or pin a sha- tag.
#
# Verify:
#   cosign verify ghcr.io/noahsurprenant/opence-server:latest \
#     --certificate-identity-regexp '^https://github\.com/NoahSurprenant/OpenCE/\.github/workflows/server-image\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "charts/**", "docs/**", ".github/workflows/build.yml", ".github/workflows/helm-chart.yml"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/noahsurprenant/opence-server

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token gets a short-lived Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Only the immutable sha- tag here; :latest moves below, once the image is pushed and signed.
          tags: |
            type=sha

      # Built and loaded first, on every event, so that the image is started before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opence-server:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # There are no maps in CI (they are never published): the server starts without them, as uid
      # 10001 on a read-only root, writes its settings to /state and binds the tunnel port. Its clean
      # stop on SIGTERM is not checked here: without maps it never reaches the frame loop that hears the
      # signal (tools/test_linux_port.py test_dedicated_server checks the stop with maps).
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name server --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:uid=10001,gid=10001 --tmpfs /tmp opence-server:ci
          for i in $(seq 1 30); do
            if docker exec server grep -qs '^ *[0-9]*: [0-9A-F]*:6987 ' /proc/net/udp /proc/net/udp6; then bound=1; break; fi
            sleep 1
          done
          docker logs server 2>&1 | head -20
          [ "${bound:-}" = 1 ] || { echo "::error::the server did not bind UDP 27015"; exit 1; }
          [ "$(docker exec server id -u)" = 10001 ]
          docker exec server test -s /state/config.toml
          docker logs server 2>&1 | grep -q 'settings: a dedicated server, hosting bloodgulch:slayer'
          docker rm -f server

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      # The same build, from the cache, pushed.
      - name: Push
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sign, verify, and move latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/server-image\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          # Metadata only: :latest now names the signed image.
          docker buildx imagetools create -t "$IMAGE:latest" "$ref"
          {
            echo "Pushed and signed $ref, now also $IMAGE:latest."
            echo
            echo "Verify: cosign verify $IMAGE:latest --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
