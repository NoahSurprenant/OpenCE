name: Helm chart

# The dedicated server's chart (charts/opence-server). Pull requests: lint, unit tests
# (helm-unittest), every ci/*-values.yaml rendered and checked against the Kubernetes schemas, and an
# end-to-end install on k3s (k3d) with the server image built from the checkout, on Kubernetes 1.34
# to 1.37.
# main: the same, then, if the chart changed, publish it to
# oci://ghcr.io/noahsurprenant/charts/opence-server as <Chart.yaml's major.minor>.<run number>, signed
# keyless with cosign.
on:
  pull_request:
    branches: [main]
    paths: ["charts/**", ".github/workflows/helm-chart.yml", "docker/server/**"]
  push:
    branches: [main]
    paths: ["charts/**", ".github/workflows/helm-chart.yml", "docker/server/**"]
  workflow_dispatch:

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CHART: charts/opence-server
  REGISTRY: ghcr.io
  # Lowercase: OCI references are.
  CHART_REPO: oci://ghcr.io/noahsurprenant/charts
  # The Kubernetes versions supported (Chart.yaml kubeVersion): the oldest and the newest.
  KUBERNETES_OLDEST: "1.34.0"
  KUBERNETES_NEWEST: "1.37.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::helm lint -f $values"
            helm lint "$CHART" --strict -f "$values"
            echo "::endgroup::"
          done
          # Without game data the chart refuses to render: the maps are never in the image.
          if helm template ci "$CHART" >/dev/null 2>&1; then
            echo "::error::The chart renders without gameData"; exit 1
          fi

      - name: Unit tests
        run: |
          set -euo pipefail
          # Helm 4 verifies plugin signatures by default; helm-unittest publishes none.
          if helm version --short | grep -q '^v3'; then verify=; else verify=--verify=false; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest $verify
          helm unittest "$CHART"

      - name: Schema check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Older than the oldest supported must be refused (Chart.yaml kubeVersion).
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --kube-version 1.33.0 >/dev/null 2>&1; then
            echo "::error::The chart renders for Kubernetes 1.33, older than its kubeVersion allows"; exit 1
          fi
          for k8s in "$KUBERNETES_OLDEST" "$KUBERNETES_NEWEST"; do
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::$values, Kubernetes $k8s"
            helm template ci "$CHART" -n opence-ci -f "$values" --kube-version "$k8s" \
              | ./kubeconform -strict -summary -kubernetes-version "$k8s"
            echo "::endgroup::"
          done
          done

  # The server image from this checkout, built once for every end-to-end run.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          tags: opence-server:e2e
          outputs: type=docker,dest=${{ runner.temp }}/opence-server.tar
          cache-from: type=gha

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-image
          path: ${{ runner.temp }}/opence-server.tar
          retention-days: 1

  # The chart on a real cluster (k3s in Docker, which enforces NetworkPolicies), on the oldest, a
  # middle and the newest supported Kubernetes: charts/opence-server/e2e/run.sh.
  e2e:
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.34.12-k3s1, v1.36.5-k3s1, v1.37.1-k3s1]
    name: e2e (${{ matrix.k3s }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Cluster
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create e2e --image "rancher/k3s:${{ matrix.k3s }}" --no-lb \
            --k3s-arg '--disable=traefik@server:0' --wait --timeout 180s
          kubectl version
          docker load -i "${{ runner.temp }}/opence-server.tar"
          # k3d can report an import that the node never made (its tools container writes a tarball
          # the node may look for too early), so the node's own image list is checked.
          for attempt in 1 2 3; do
            k3d image import opence-server:e2e -c e2e || true
            if docker exec k3d-e2e-server-0 ctr -n k8s.io images ls -q | grep -qx docker.io/library/opence-server:e2e; then
              echo "The image is in the cluster (import $attempt)."; break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::The image isn't in the cluster after 3 imports"; exit 1; }
            sleep 5
          done

      - name: End-to-end
        env:
          IMAGE: opence-server:e2e
        run: ${{ env.CHART }}/e2e/run.sh minimal

  # Publishes the chart when it changed: version <Chart.yaml's major.minor>.<this workflow's run
  # number>, so every change gets a new version without anyone bumping it; a major or minor bump is a
  # Chart.yaml edit. Then signs it keyless with cosign (Sigstore) and checks the signature.
  publish:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the chart change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A push that didn't touch the chart (only the Dockerfile, say) publishes nothing; a manual
          # run or an unknown base always does.
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- "$CHART"; then
            echo "The chart didn't change: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.changed.outputs.publish == 'true'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changed.outputs.publish == 'true'

      - name: Publish and sign
        if: steps.changed.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-chart\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # cosign reads the registry credentials from Docker's config.
          echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: *//p' "$CHART/Chart.yaml")
          version="${base%.*}.${{ github.run_number }}"
          # A re-run of this run would reuse its number: never overwrite a published version.
          if helm show chart "$CHART_REPO/opence-server" --version "$version" >/dev/null 2>&1; then
            echo "opence-server $version is already published; not overwriting it."
            exit 0
          fi
          helm package "$CHART" --version "$version" -d dist
          helm push "dist/opence-server-$version.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/opence-server@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published and signed $CHART_REPO/opence-server:$version ($digest)."
            echo
            echo "Verify: cosign verify ${ref%@*}:$version --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
